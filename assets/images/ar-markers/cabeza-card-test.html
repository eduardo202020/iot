<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MuseIQ AR Marker Test</title>
    <style>
      body {
        align-items: center;
        background: #f2f2f2;
        color: #111;
        display: flex;
        font-family: sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }

      main {
        background: white;
        border: 1px solid #ddd;
        padding: 1cm;
        text-align: center;
      }

      img {
        display: block;
        width: 5cm;
      }

      p {
        font-size: 12px;
        margin: 0.25cm 0 0;
      }

      @media print {
        body {
          background: white;
        }

        main {
          border: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img alt="MuseIQ AR marker cabeza" src="./cabeza.jpg" />
      <p>Ancho objetivo: 5 cm</p>
    </main>
  </body>
</html>
